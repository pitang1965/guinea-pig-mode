<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>simtest</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#fff}
 #shelf{position:fixed;left:120px;bottom:64px;width:300px;margin:0;padding:8px;
        background:#dfe7f2;border-radius:8px;font-size:16px;text-align:center}
 #out{position:fixed;left:8px;top:8px;font:13px/1.55 monospace;white-space:pre;color:#036}
</style></head><body>
<div id="out">running…</div>
<h2 id="shelf">足場（見出し）</h2>
<script>
const STUB={enabled:true,count:1,size:64,speed:1,color:'ginger',accessory:'none',
  walkOnElements:true,keyboardControls:false,followCursor:false,wheek:true,disabledSites:[]};
window.chrome={runtime:{getURL:p=>'/'+p,onMessage:{addListener(){}}},
  storage:{sync:{get:async()=>({moru:STUB}),set:async()=>{}},onChanged:{addListener(){}}}};
const lines=[];let fails=0;
const say=m=>{lines.push(m);document.getElementById('out').textContent=lines.join('\n');};
const check=(name,ok,extra)=>{if(!ok)fails++;say((ok?'PASS ':'FAIL ')+name+(extra?'  ['+extra+']':''));};
window.addEventListener('error',e=>say('ERROR '+e.message));
</script>
<script src="/src/shared/settings.js"></script>
<script src="/src/content/character.js"></script>
<script src="/src/content/pet.js"></script>
<script src="/src/content/main.js"></script>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const step=(pet,seconds)=>{for(let i=0;i<Math.round(seconds*60);i++)pet.update(1/60);};
const FOOT=0.94;
const feet=p=>p.y+p.h*FOOT;

(async()=>{
  await wait(200);
  const d=__moruDebug();
  const pet=d.pets[0];
  const shelf=document.getElementById('shelf').getBoundingClientRect();
  say('viewport '+innerWidth+'x'+innerHeight+'  groundFeet='+innerHeight);
  say('shelf top='+shelf.top.toFixed(0)+' left='+shelf.left.toFixed(0)+' right='+shelf.right.toFixed(0));

  check('mounted', d.running && d.pets.length===1);
  check('足場を検出', d.platforms.length>0, 'n='+d.platforms.length);

  // 1) 自発的に足場へ跳び乗る
  pet.platformEl=null; pet.x=shelf.left+40; pet.y=pet.groundY(); pet.vx=0; pet.vy=0;
  pet.surfaceY=innerHeight; pet.setState('idle',9);
  const jumped=pet.jumpToPlatform();
  // 着地後に自分でまた跳ぶことがあるので、固定秒数ではなく「乗るまで」進める
  let landedOnShelf=false;
  for(let k=0;k<120;k++){pet.update(1/60); if(pet.platformEl){landedOnShelf=true;break;}}
  check('自発ジャンプで足場に乗る', jumped && landedOnShelf,
        'jumped='+jumped+' feet='+feet(pet).toFixed(0)+' shelfTop='+shelf.top.toFixed(0));

  // 2) 上から落として着地
  pet.platformEl=null; pet.x=shelf.left+80; pet.y=shelf.top-200; pet.vx=0; pet.vy=0; pet.setState('fall',0);
  let dropped=false;
  for(let k=0;k<120;k++){pet.update(1/60); if(pet.platformEl){dropped=true;break;}}
  check('落下して足場に着地', dropped && Math.abs(feet(pet)-shelf.top)<2,
        'feet='+feet(pet).toFixed(1)+' state='+pet.state);

  // 3) 足場の端を越えたら引き返すか落ちる
  let turned=0,fell=0;
  for(let t=0;t<40;t++){
    pet.platformEl=document.getElementById('shelf');
    pet.x=shelf.right+30; pet.dir=1; pet.setState('walk',9);
    pet.update(1/60);
    if(pet.platformEl)turned++;else fell++;
  }
  check('端で引き返す/落ちるの両方が起きる', turned>0&&fell>0, 'turn='+turned+' fall='+fell);

  // 4) 空中から地面へ落ち着く
  pet.platformEl=null; pet.x=innerWidth-200; pet.y=0; pet.vx=0; pet.vy=0; pet.setState('fall',0);
  let landedAt=-1;
  for(let k=0;k<180;k++){pet.update(1/60);if(pet.state!=='fall'){landedAt=k;break;}}
  check('地面で静止', landedAt>=0 && Math.abs(pet.y-pet.groundY())<1.5 && !pet.airborne(),
        'frame='+landedAt+' y='+pet.y.toFixed(1)+' ground='+pet.groundY().toFixed(1)+' state='+pet.state);

  // ★ 地面の上で自発的に歩き出せるか（足が動かず滑る不具合の再現）
  pet.platformEl=null; pet.x=innerWidth/2; pet.y=pet.groundY(); pet.vx=0; pet.vy=0; pet.setState('idle',0.05);
  // 往復すると正味の変位は 0 に近づくので、総移動距離で測る
  // 睡眠は 4〜10 秒続くので、観測窓を短くすると「寝ていただけ」で落ちる
  const seenStates=new Set(); let travelled=0;
  for(let k=0;k<60*30;k++){
    const px=pet.x; pet.update(1/60);
    seenStates.add(pet.state); travelled+=Math.abs(pet.x-px);
  }
  check('地面でも歩き出す', seenStates.has('walk')||seenStates.has('run'), [...seenStates].join(','));
  check('地面で実際に移動する', travelled>40, '総移動距離='+travelled.toFixed(0));

  // 空中とポップコーン中は脚をたたむのが正しい。離陸・着地のフレームも
  // 飛行の一部なので、フレームの開始時と終了時の両方が接地している場合だけを見る
  let movingFrames=0, gaitFrames=0, badStates=new Set();
  const grounded=q=>!q.airborne()&&q.state!=='popcorn';
  for(let k=0;k<60*30;k++){
    const px=pet.x, wasGrounded=grounded(pet);
    pet.update(1/60);
    if(Math.abs(pet.x-px)>0.05 && wasGrounded && grounded(pet)){
      movingFrames++;
      if(pet.el.classList.contains('st-walk')||pet.el.classList.contains('st-run'))gaitFrames++;
      else badStates.add(pet.state);
    }
  }
  check('接地して移動中は必ず歩行アニメが付く', movingFrames>60 && gaitFrames===movingFrames,
        gaitFrames+'/'+movingFrames+' フレーム'+(badStates.size?' 例外='+[...badStates].join(','):''));

  // ★ decide() が跳んだ横速度を、同じフレームで消してしまわないか
  const realRandom=Math.random;
  Math.random=()=>0.85;                       // decide() の「足場へ跳ぶ」分岐に固定
  pet.platformEl=null; pet.x=Math.max(0,shelf.left-120); pet.y=pet.groundY();
  pet.vx=0; pet.vy=0; pet.surfaceY=innerHeight; pet.setState('idle',0);
  pet.update(1/60);
  const jumpVx=pet.vx, jumpState=pet.state;
  Math.random=realRandom;
  check('自発ジャンプで横速度が残る', jumpState==='jump' && Math.abs(jumpVx)>1,
        'state='+jumpState+' vx='+jumpVx.toFixed(0));
  let reached=false;
  for(let k=0;k<120;k++){pet.update(1/60); if(pet.platformEl){reached=true;break;}}
  check('自発ジャンプで足場に届く', reached && Math.abs(feet(pet)-shelf.top)<2,
        'state='+pet.state+' feet='+feet(pet).toFixed(0)+' shelfTop='+shelf.top.toFixed(0));

  // ★ 足場から跳んだときに足場から離れられるか（その場で固まらないか）
  const shelfEl=document.getElementById('shelf');
  pet.platformEl=shelfEl; pet.x=shelf.left+80; pet.y=shelf.top-pet.h*FOOT;
  pet.vx=0; pet.vy=0; pet.setState('idle',9);
  const yTop0=pet.y;
  pet.onKey('jump',true);
  for(let k=0;k<12;k++) pet.update(1/60);
  check('足場から跳び上がれる', pet.platformEl===null && pet.y<yTop0-20,
        'platform='+!!pet.platformEl+' dy='+(pet.y-yTop0).toFixed(0));
  let settled=-1;
  for(let k=0;k<300;k++){pet.update(1/60); if(!pet.airborne()){settled=k;break;}}
  check('足場から跳んだあと固まらない', settled>=0,
        settled>=0?('frame='+settled+' state='+pet.state):'5秒たっても空中のまま');
  pet.platformEl=null; pet.y=pet.groundY(); pet.vx=0; pet.vy=0;

  // 5) 左右の壁で止まる
  pet.x=-500; pet.setState('walk',9); pet.dir=-1; step(pet,0.5);
  const leftOk=pet.x>=-1 && pet.dir===1;
  pet.x=innerWidth+500; pet.dir=1; pet.setState('walk',9); step(pet,0.5);
  check('画面端で折り返す', leftOk && pet.x<=innerWidth-pet.w+1 && pet.dir===-1,
        'x='+pet.x.toFixed(0)+' dir='+pet.dir);

  // 6) ドラッグして投げる
  const ev=(type,x,y)=>pet.el.dispatchEvent(new PointerEvent(type,
    {clientX:x,clientY:y,pointerId:1,button:0,buttons:1,pointerType:'mouse',bubbles:true,cancelable:true}));
  pet.y=pet.groundY(); pet.x=300;
  ev('pointerdown',320,pet.y+30);
  const dragState=pet.state;
  ev('pointermove',360,pet.y-20); ev('pointermove',420,pet.y-70); ev('pointermove',480,pet.y-120);
  ev('pointerup',480,pet.y-120);
  check('ドラッグ状態になる', dragState==='drag', dragState);
  check('放すと投げられる', pet.state==='fall' && pet.vx>0, 'vx='+pet.vx.toFixed(0)+' state='+pet.state);
  step(pet,3);
  check('投げた後も画面内に収まる',
        pet.x>=-pet.w && pet.x<=innerWidth && feet(pet)<=innerHeight+1,
        'x='+pet.x.toFixed(0)+' feet='+feet(pet).toFixed(0));

  // 7) クリックで反応
  pet.platformEl=null; pet.y=pet.groundY(); pet.vy=0; pet.setState('idle',9);
  ev('pointerdown',pet.x+40,pet.y+30); ev('pointerup',pet.x+40,pet.y+30);
  const shadowBubble=pet.bubble.classList.contains('show');
  check('クリックで跳ねて吹き出しが出る', pet.state==='jump' && pet.vy<0 && shadowBubble,
        'state='+pet.state+' vy='+pet.vy.toFixed(0)+' bubble='+shadowBubble);

  // 8) 設定変更が反映される
  pet.applySettings(Object.assign({},STUB,{size:100,color:'tricolor',accessory:'crown'}));
  check('設定変更で描き直される', pet.h===100 && pet.el.querySelector('.acc-crown')!==null,
        'h='+pet.h);

  // 9) 実際のヒットテスト（ページ側のクリックを奪わないか）
  pet.applySettings(STUB);
  pet.platformEl=null; pet.x=520; pet.y=pet.groundY(); pet.render(true);
  const host=document.getElementById('moru-mode-host');
  const bodyPt=[pet.x+pet.w*0.45, pet.y+pet.h*0.55];
  const hit=document.elementFromPoint(bodyPt[0],bodyPt[1]);
  const outside=document.elementFromPoint(20,innerHeight-10);
  check('モルモット本体はクリックできる', hit===host, 'hit='+(hit&&(hit.id||hit.tagName)));
  check('本体以外はページに素通しする', outside!==host, 'outside='+(outside&&(outside.id||outside.tagName)));
  check('スタイルが適用されている',
    getComputedStyle(host.shadowRoot.querySelector('.moru')).position==='absolute');

  // 10) ランダムの姿
  const rnd=Object.assign({},STUB,{color:'random',accessory:'random',variantSeed:1});
  const mk=i=>new MoruPet({settings:rnd,mouse:{x:0,y:0,seen:false},platforms:()=>[]},100+i);
  const petsR=[];for(let i=0;i<12;i++)petsR.push(mk(i));
  const colors=new Set(petsR.map(p=>p.color));
  const accs=new Set(petsR.map(p=>p.accessory));
  check('ランダムで1匹ずつ毛色が違う', colors.size>1, [...colors].join(','));
  check('ランダムでアクセサリーも散らばる', accs.size>1, [...accs].join(','));

  const p0=petsR[0], before=p0.color+'/'+p0.accessory;
  p0.applySettings(Object.assign({},rnd,{size:90}));
  check('大きさを変えても姿は変わらない', p0.color+'/'+p0.accessory===before,
        before+' -> '+p0.color+'/'+p0.accessory);

  let rerolled=0;
  for(const p of petsR){const was=p.color+'/'+p.accessory;
    p.applySettings(Object.assign({},rnd,{variantSeed:2}));
    if(p.color+'/'+p.accessory!==was)rerolled++;}
  check('シャッフルで引き直される', rerolled>0, rerolled+'/12 が変化');

  p0.applySettings(Object.assign({},STUB,{color:'black',accessory:'hat',variantSeed:2}));
  check('固定の姿に戻せる', p0.color==='black'&&p0.accessory==='hat'&&p0.el.querySelector('.acc-hat'),
        p0.color+'/'+p0.accessory);
  petsR.forEach(p=>p.destroy());

  // 11) 個体同士が完全には重ならない
  const live=__moruDebug().pets;
  const extra=[];
  for(let i=0;i<2;i++){
    const q=new MoruPet({settings:STUB,mouse:{x:0,y:0,seen:false},platforms:()=>[]},200+i);
    extra.push(q); live.push(q);
  }
  live.forEach(q=>{q.platformEl=null;q.x=400;q.y=q.groundY();q.vx=0;q.vy=0;q.setState('idle',9);});
  for(let k=0;k<200;k++) __moruDebug().separate();
  const W=Math.min.apply(null,live.map(q=>q.w));   // 個体差で体格が違うので細い方に合わせる
  const xs=live.map(q=>q.x+q.w/2).sort((a,b)=>a-b);
  const gaps=xs.slice(1).map((v,i)=>v-xs[i]);
  const minGap=Math.min.apply(null,gaps);
  check('同じ位置に置いても重なりが解ける', live.length===3 && minGap>W*0.5,
        'n='+live.length+' minGap='+minGap.toFixed(1)+' w='+W.toFixed(0));
  check('離れすぎず連なる間隔になる', minGap<W*0.8, 'minGap='+minGap.toFixed(1)+' ('+(minGap/W).toFixed(2)+'×体幅)');

  // 壁際に集めても重ならない
  live.forEach(q=>{q.x=innerWidth;q.y=q.groundY();});
  for(let k=0;k<200;k++) __moruDebug().separate();
  const xs2=live.map(q=>q.x+q.w/2).sort((a,b)=>a-b);
  const minGap2=Math.min.apply(null,xs2.slice(1).map((v,i)=>v-xs2[i]));
  check('画面端でも積み重ならない', minGap2>W*0.5, 'minGap='+minGap2.toFixed(1));

  // 12) アニメーションの位相が個体ごとにばらける
  const varOf=(q,n)=>q.el.style.getPropertyValue(n);
  const uniq=n=>new Set(live.map(q=>varOf(q,n))).size;
  check('まばたきの位相がばらける', uniq('--blink-delay')===live.length,
        live.map(q=>varOf(q,'--blink-delay')).join(' '));
  check('まばたきの周期もばらける', uniq('--blink-dur')===live.length,
        live.map(q=>varOf(q,'--blink-dur')).join(' '));
  check('耳・呼吸・歩調もばらける',
        uniq('--ear-delay')===live.length && uniq('--breathe-delay')===live.length &&
        uniq('--gait-delay')===live.length,
        'ear/breathe/gait');
  const eye=live[0].el.querySelector('.eye-open');
  const cs=eye?getComputedStyle(eye):null;
  check('CSS 側に delay が効いている',
        !!cs && cs.animationName==='moru-blink' && parseFloat(cs.animationDelay)<0,
        cs?(cs.animationName+' delay='+cs.animationDelay+' dur='+cs.animationDuration):'no eye');

  extra.forEach(q=>{live.splice(live.indexOf(q),1);q.destroy();});

  // 13) 個体差（大きさ・速さ・カーソルへの反応時間）
  const spread=a=>Math.max.apply(null,a)-Math.min.apply(null,a);
  const varied=Object.assign({},STUB,{variation:0.6});
  const vp=[];
  for(let i=0;i<12;i++){
    vp.push(new MoruPet({settings:varied,mouse:{x:0,y:0,seen:false},platforms:()=>[]},300+i));
  }
  const sizes=vp.map(q=>q.h), speeds=vp.map(q=>q.speedMul), reacts=vp.map(q=>q.reactDelay);
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  check('大きさがばらつく', spread(sizes)>4, 'min='+Math.min.apply(null,sizes)+' max='+Math.max.apply(null,sizes));
  check('速さがばらつく', spread(speeds)>0.2, speeds.map(v=>v.toFixed(2)).join(' '));
  check('反応時間がばらつく', spread(reacts)>0.2, reacts.map(v=>v.toFixed(2)).join(' '));
  check('設定した大きさが中心になる', Math.abs(mean(sizes)-STUB.size)<STUB.size*0.25,
        '平均='+mean(sizes).toFixed(1)+' 設定='+STUB.size);

  vp.forEach(q=>q.applySettings(Object.assign({},varied,{variation:0})));
  check('ばらつき0なら全部そろう',
        new Set(vp.map(q=>q.h)).size===1 && new Set(vp.map(q=>q.speedMul)).size===1 &&
        vp.every(q=>q.reactDelay===0), 'h='+vp[0].h);

  // ばらつきの強さを変えても、大きい方／速い方といった個体の性格は入れ替わらない
  vp.forEach(q=>q.applySettings(Object.assign({},varied,{variation:0.3})));
  const weak=vp.map(q=>q.speedMul);
  vp.forEach(q=>q.applySettings(Object.assign({},varied,{variation:0.9})));
  const strong=vp.map(q=>q.speedMul);
  check('ばらつきを変えても速い子/遅い子は入れ替わらない',
        weak.every((v,i)=>(v-1)*(strong[i]-1)>=0) && spread(strong)>spread(weak),
        '振れ幅 '+spread(weak).toFixed(2)+' -> '+spread(strong).toFixed(2));
  vp.forEach(q=>q.destroy());

  // 反応時間のあいだはカーソルに気づかない
  const cursor={x:0,y:0,seen:true};
  const cfg=Object.assign({},STUB,{variation:1,followCursor:true});
  const slow=new MoruPet({settings:cfg,mouse:cursor,platforms:()=>[]},400);
  slow.vary={size:0,speed:0,react:1};        // いちばん鈍い個体に固定する
  slow.applySettings(cfg);
  slow.platformEl=null; slow.x=200; slow.y=slow.groundY(); slow.vx=0; slow.vy=0;
  slow.setState('idle',9);
  cursor.x=innerWidth-40;
  const from=slow.x;
  step(slow,slow.reactDelay*0.5);          // 反応時間の半分では、まだ気づかない
  const early=Math.abs(slow.x-from);
  step(slow,slow.reactDelay*0.5+0.5);      // 過ぎたら追い始める
  const late=Math.abs(slow.x-from);
  check('反応時間のあいだは動き出さない', early<1, 'reactDelay='+slow.reactDelay.toFixed(2)+'s dx='+early.toFixed(1));
  check('反応時間が過ぎたら追いかける', late>10 && slow.dir===1, 'dx='+late.toFixed(1)+' dir='+slow.dir);
  slow.destroy();

  // 14) 体格を基準に速度・歩幅・足の回転がそろっているか
  const STRIDE=44*0.42/64;                    // 基準体格での歩幅／体高
  const mkAt=(patch,i)=>new MoruPet(
    {settings:Object.assign({},STUB,patch),mouse:{x:0,y:0,seen:false},platforms:()=>[]},500+i);
  const gait=(q,n)=>parseFloat(q.el.style.getPropertyValue(n));
  const speedIn=(q,st)=>{
    q.platformEl=null; q.x=innerWidth/2; q.y=q.groundY(); q.vx=0; q.vy=0;
    q.setState(st,9); q.update(1/60); return Math.abs(q.vx);
  };
  const small=mkAt({size:40},0), big=mkAt({size:120},1);
  const vs=speedIn(small,'walk'), vb=speedIn(big,'walk');
  check('体格に比例して速く歩く', Math.abs(vb/vs-big.h/small.h)<0.02,
        small.h+'px:'+vs.toFixed(1)+'px/s  '+big.h+'px:'+vb.toFixed(1)+'px/s');
  const strideS=vs*gait(small,'--walk'), strideB=vb*gait(big,'--walk');
  check('歩幅も体格に比例する',
        Math.abs(strideS/small.h-STRIDE)<0.01 && Math.abs(strideB/big.h-STRIDE)<0.01,
        '歩幅/体高 '+(strideS/small.h).toFixed(3)+' / '+(strideB/big.h).toFixed(3));

  const runStride=speedIn(small,'run')*gait(small,'--run');
  check('走ると足も速く回る', gait(small,'--run')<gait(small,'--walk'),
        'walk='+gait(small,'--walk').toFixed(3)+'s run='+gait(small,'--run').toFixed(3)+'s');
  check('走りの歩幅は歩きの約1.7倍に収まる', Math.abs(runStride/strideS-Math.sqrt(3))<0.05,
        (runStride/strideS).toFixed(2)+'倍');

  // 速さを変えても歩幅は変わらない＝足が滑らない
  const strideAt=q=>speedIn(q,'walk')*gait(q,'--walk')/q.h;
  const fast=mkAt({speed:2.5},2), slow2=mkAt({speed:0.4},3);
  check('速さを変えても歩幅は一定',
        Math.abs(strideAt(fast)-STRIDE)<0.01 && Math.abs(strideAt(slow2)-STRIDE)<0.01,
        '速2.5→'+strideAt(fast).toFixed(3)+'  速0.4→'+strideAt(slow2).toFixed(3));

  // 上下限で丸められる極端な設定でも、速度と周期が同じ倍率から出ているのでずれない
  const edge=mkAt({speed:0.4,variation:1},4);
  edge.vary={size:0,speed:-1,react:0};
  edge.applySettings(Object.assign({},STUB,{speed:0.4,variation:1}));
  check('極端な設定でも足は滑らない', Math.abs(strideAt(edge)-STRIDE)<0.01,
        '歩幅/体高='+strideAt(edge).toFixed(3)+' 周期='+gait(edge,'--walk').toFixed(3)+'s');
  [small,big,fast,slow2,edge].forEach(q=>q.destroy());

  // 走りの周期は shorthand の後ろで差し替えているので、実際に効いているか実物で見る
  const livePet=__moruDebug().pets[0];
  const durOf=st=>{livePet.setState(st,9);
    return parseFloat(getComputedStyle(livePet.el.querySelector('.leg-a')).animationDuration);};
  const runDur=durOf('run'), walkDur=durOf('walk');
  check('走りの周期が CSS に効いている',
        Math.abs(runDur-gait(livePet,'--run'))<0.005 && Math.abs(walkDur-gait(livePet,'--walk'))<0.005,
        'walk='+walkDur+'s run='+runDur+'s');
  livePet.setState('idle',1);

  say(fails? '=== '+fails+' FAILED ===' : '=== ALL PASSED ===');
})();
</script>
</body></html>
